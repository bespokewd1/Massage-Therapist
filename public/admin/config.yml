# See full Decap documentation for further configuration: https://decapcms.org/docs/intro/
backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to master)
local_backend: true
media_folder: src/assets/images/blog # Location where files will be stored in the repo - we store them in src so that Astro can optimize them.
public_folder: src/assets/images/blog  # Ensure that this path is the same as the media_folder path above.
site_url: https://stonemassage.ca/ # Displays a link to home page in the top-right corner of the CMS dashboard
logo_url: https://codestitch.app/frontend/images/logo.png # change url to a link to the image you want to use, no file paths, must be a URL
collections:
  - name: "blog" # Used in routes, e.g., /admin/collections/blog. Is also the key when fetching data from the CMS.
    label: "Blog" # Used in the admin dashboard UI
    folder: "src/content/blog" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    fields: # The fields for each document
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Image Caption", name: "imageAlt", widget: "string" }
      - { label: "Tags", name: "tags", widget: "list", default: ["post"] }
      - label: SEO and social sharing
        name: seo
        widget: object
        required: false
        collapsed: true
        hint: Optional metadata overrides. Blank fields use the article title, description and featured image.
        fields:
        - label: SEO title
          name: title
          widget: string
          required: false
          hint: Leave blank to use the article title. Stone Massage is added automatically.
        - label: SEO description
          name: description
          widget: text
          required: false
          hint: Leave blank to use the article description.
        - label: Social description
          name: socialDescription
          widget: text
          required: false
          hint: Leave blank to use the SEO description.
        - label: Photo for generated social card
          name: ogPhoto
          widget: image
          required: false
          media_folder: /src/assets/images/og
          public_folder: /src/assets/images/og
          choose_url: true
          hint: Leave blank to use the featured image. Use a clean photo without text for the generated card,
            not a complete card. Upload a photo, or enter an existing /src/assets/images/... path.
        - label: Complete social image override
          name: ogImage
          widget: image
          required: false
          media_folder: /src/assets/images/og
          public_folder: /src/assets/images/og
          choose_url: true
          hint: Leave blank for an automatically generated social card. Upload a complete 1200 x 630 card, or enter an
            existing /src/assets/images/... path.
        - label: Social image alt text
          name: ogImageAlt
          widget: string
          required: false
          hint: Describe the image. Leave blank to use the featured image caption.
      - { label: "Body", name: "body", widget: "markdown" }
  - name: siteSettings
    label: Site settings
    media_folder: /src/assets/images/og
    public_folder: /src/assets/images/og
    editor:
      preview: false
    files:
    - label: SEO and social sharing
      name: seoPages
      file: src/data/seo-pages.json
      format: json
      fields:
      - label: Global defaults
        name: global
        widget: object
        collapsed: false
        required: true
        fields:
        - label: SEO title
          name: title
          widget: string
          required: true
          hint: Stone Massage is added automatically.
        - label: SEO description
          name: description
          widget: text
          required: true
          hint: Default description for pages without an override.
        - label: Social description
          name: socialDescription
          widget: text
          required: false
          hint: Leave blank to use the SEO description.
        - label: Photo for generated social card
          name: ogPhoto
          widget: image
          required: true
          media_folder: /src/assets/images/og
          public_folder: /src/assets/images/og
          choose_url: true
          hint: Use a clean source photo, not a screenshot or finished card. Upload a photo, or enter an existing
            /src/assets/images/... path.
        - label: Complete social image override
          name: ogImage
          widget: image
          required: false
          media_folder: /src/assets/images/og
          public_folder: /src/assets/images/og
          choose_url: true
          hint: Leave blank for an automatically generated social card. Upload a complete 1200 x 630 card, or enter
            an existing /src/assets/images/... path.
        - label: Social image alt text
          name: ogImageAlt
          widget: string
          required: false
          hint: Describe the generated card photo or the complete override image.
